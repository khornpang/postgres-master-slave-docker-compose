# PostgreSQL 16 - Production Standby Configuration
# Most settings mirror the primary (WAL settings MUST match).
# Standby-specific tuning at the bottom.

#-----------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#-----------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 200                   # MUST be >= primary's max_connections
password_encryption = scram-sha-256

#-----------------------------------------------------------
# RESOURCE USAGE
#-----------------------------------------------------------
shared_buffers = 2GB
huge_pages = try
work_mem = 16MB
maintenance_work_mem = 512MB
effective_cache_size = 6GB
effective_io_concurrency = 200
random_page_cost = 1.1

#-----------------------------------------------------------
# WRITE-AHEAD LOG - must match primary
#-----------------------------------------------------------
wal_level = replica
wal_compression = on
wal_buffers = 16MB
full_page_writes = on

checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# Archive mode is harmless during recovery (archiver doesn't fire on standby).
# Leave on so a promoted standby keeps archiving without reconfig.
archive_mode = on
archive_command = '/bin/true'           # standby does not archive; placeholder

#-----------------------------------------------------------
# REPLICATION - must match primary
#-----------------------------------------------------------
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB
max_slot_wal_keep_size = 10GB

#-----------------------------------------------------------
# HOT STANDBY - the important part for read scaling
#-----------------------------------------------------------
hot_standby = on

# Tell the primary which rows we still need so VACUUM doesn't remove them
# while a long report query is running. Cost: mild bloat on the primary.
# For a reporting standby this trade is the right one.
hot_standby_feedback = on

# How long the standby will pause WAL replay to let a running query finish
# before cancelling it. 5 minutes is generous for reports; lower if you'd
# rather minimize replication lag.
max_standby_streaming_delay = 300s
max_standby_archive_delay = 300s

# Heartbeat / disconnect detection
wal_receiver_status_interval = 10s
wal_receiver_timeout = 60s
wal_retrieve_retry_interval = 5s

#-----------------------------------------------------------
# QUERY TUNING
#-----------------------------------------------------------
default_statistics_target = 100
jit = on
max_worker_processes = 8
max_parallel_workers_per_gather = 4     # bias toward more parallelism for reports
max_parallel_workers = 8

#-----------------------------------------------------------
# LOGGING
#-----------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_file_mode = 0640
log_truncate_on_rotation = off

log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%t [%p] %q%u@%d/%a from %h '
log_timezone = 'Asia/Phnom_Penh'

#-----------------------------------------------------------
# STATISTICS
#-----------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
track_activity_query_size = 4096

pg_stat_statements.max = 10000
pg_stat_statements.track = all

#-----------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#-----------------------------------------------------------
timezone = 'Asia/Phnom_Penh'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'

# Reports can run long. Set per-session if you need to cap them.
statement_timeout = 0
lock_timeout = 10s
idle_in_transaction_session_timeout = 5min
