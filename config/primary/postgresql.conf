# PostgreSQL 16 - Production Primary Configuration
# Baseline: 8 GB RAM / 4 vCPU host. Scale settings proportionally if different.
# Key formulas:
#   shared_buffers        = 25% of RAM
#   effective_cache_size  = 75% of RAM
#   work_mem              = (RAM - shared_buffers) / (max_connections * 3)
#   maintenance_work_mem  = RAM / 16   (cap ~ 2GB)

#-----------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#-----------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 200
password_encryption = scram-sha-256

#-----------------------------------------------------------
# RESOURCE USAGE
#-----------------------------------------------------------
shared_buffers = 2GB
huge_pages = try
work_mem = 16MB
maintenance_work_mem = 512MB
effective_cache_size = 6GB
effective_io_concurrency = 200          # SSD
random_page_cost = 1.1                  # SSD

#-----------------------------------------------------------
# WRITE-AHEAD LOG
#-----------------------------------------------------------
wal_level = replica
wal_compression = on
wal_buffers = 16MB
synchronous_commit = on                 # local fsync; replication is async by default
full_page_writes = on

# Checkpoints
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# WAL Archiving - REQUIRED for point-in-time recovery
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'
archive_timeout = 300                   # force-archive at least every 5min even if idle

#-----------------------------------------------------------
# REPLICATION
#-----------------------------------------------------------
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB
max_slot_wal_keep_size = 10GB           # cap so a dead standby can't fill disk
hot_standby = on                        # harmless on primary; helps if promoted-then-demoted

#-----------------------------------------------------------
# QUERY TUNING
#-----------------------------------------------------------
default_statistics_target = 100
jit = on
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_workers = 8
max_parallel_maintenance_workers = 2

#-----------------------------------------------------------
# AUTOVACUUM - tuned more aggressively than defaults
#-----------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 2000

#-----------------------------------------------------------
# LOGGING - flows to /var/log/postgresql (mounted volume)
#-----------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_file_mode = 0640
log_truncate_on_rotation = off

log_min_duration_statement = 1000       # log queries > 1s (catch slow ones)
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0                      # log all temp files (sort/hash spilling to disk)
log_autovacuum_min_duration = 1000
log_line_prefix = '%t [%p] %q%u@%d/%a from %h '
log_timezone = 'Asia/Phnom_Penh'
log_error_verbosity = default

#-----------------------------------------------------------
# STATISTICS / EXTENSIONS
#-----------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
track_functions = pl
track_activity_query_size = 4096

pg_stat_statements.max = 10000
pg_stat_statements.track = all

#-----------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#-----------------------------------------------------------
timezone = 'Asia/Phnom_Penh'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'

# Defensive timeouts - prevent runaway queries / forgotten transactions
statement_timeout = 0                   # set per-role/session as needed
lock_timeout = 10s
idle_in_transaction_session_timeout = 5min
