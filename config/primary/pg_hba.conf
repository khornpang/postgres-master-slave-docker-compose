# PostgreSQL Client Authentication Configuration - Primary
# CIDR 172.28.0.0/24 = the pg-net Docker bridge defined in compose.
# Add your application's CIDR here if it runs outside Docker.

# TYPE   DATABASE     USER             ADDRESS            METHOD

# Local unix-socket connections (used by docker exec ... psql)
local    all          all                                 scram-sha-256

# Loopback (in-container psql, healthchecks)
host     all          all              127.0.0.1/32       scram-sha-256
host     all          all              ::1/128            scram-sha-256

# Application + readonly users from the Docker network
host     all          all              172.28.0.0/24      scram-sha-256

# Remote clients (pgAdmin, app servers, etc). 0.0.0.0/0 means any source IP
# that can reach the published port can attempt to authenticate — restrict
# access at the host firewall / cloud security-group layer.
host     all          all              0.0.0.0/0          scram-sha-256

# Replication from the standby (Docker network).
# Use a tighter address (e.g. 172.28.0.11/32) if you want belt-and-braces.
host     replication  replicator       172.28.0.0/24      scram-sha-256

# DENY everything else by default (Postgres rejects unmatched rows).
